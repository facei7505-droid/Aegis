name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Signatures only
        run: pytest -q
        env:
          AEGIS_NO_LIBINJECTION: "1"
      - name: Build libinjection (Linux, macOS)
        if: runner.os != 'Windows'
        run: aegis build-engine
      - name: Signatures + libinjection
        if: runner.os != 'Windows'
        run: pytest -q
      - name: Self-healing demo (fails if any attack still works)
        run: aegis demo --report aegis-demo-report.html
      - name: Aegis scans its own code
        run: aegis scan .

  security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: aegis scan . --format sarif --output aegis.sarif --fail-on never
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aegis.sarif
          category: aegis
