[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-selfheal"
version = "1.4.0"
description = "Self-healing application security: find vulnerabilities, block live attacks, and patch the vulnerable line with verified fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Magzhan Koilybai" }]
keywords = ["security", "appsec", "sast", "waf", "self-healing", "auto-remediation", "llm", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Framework :: Flask",
  "Framework :: Django",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = ['tomli>=1.1; python_version < "3.11"']   # none on 3.11+ (tomli is the stdlib tomllib)

[project.optional-dependencies]
demo = ["flask>=2.2"]
edge = ["reportlab>=4"]   # monthly PDF reports for Aegis Edge
dev = ["flask>=2.2", "pytest>=7", "reportlab>=4", "cryptography>=41"]

[project.scripts]
aegis = "aegis.cli:main"

[project.urls]
Homepage = "https://github.com/facei7505-droid/aegis"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["gateway_dashboard.html", "edge/fonts/*", "edge/connectors/*", "shield/native/libinjection/*", "shield/data/crs/*", "demo_app/vulnshop/*.py", "demo_app/vulnshop/*.txt", "demo_app/vulnshop/files/*", "demo_app/vulnshop/tools/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.aegis]
exclude = ["aegis/demo_app/*", "tests/*", "benchmarks/*", "examples/*"]
fail_on = "high"
